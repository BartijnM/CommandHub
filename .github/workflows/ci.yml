name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - name: Node.js voor MCP Inspector
        if: runner.os == 'Linux' || runner.os == 'macOS'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: MCP-basistest op Ubuntu en macOS
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        timeout-minutes: 5
        env:
          COMMANDHUB_CONFIG: ${{ runner.os == 'macOS' && 'config/tools.macos.json' || 'config/tools.linux.json' }}
        run: |
          set -euo pipefail

          output_dir="$(mktemp -d "$RUNNER_TEMP/commandhub-mcp.XXXXXX")"
          ./target/debug/commandhub > "$output_dir/server.log" 2>&1 &
          server_pid=$!

          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
            cat "$output_dir/server.log"
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --max-time 2 http://127.0.0.1:3000/status \
              | jq -e '.status == "ok"' > /dev/null; then
              break
            fi
            kill -0 "$server_pid"
            sleep 1
          done

          curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/status \
            | jq -e '.status == "ok"'

          inspector=(
            npx --yes @modelcontextprotocol/inspector@2.11.0
            --cli http://127.0.0.1:3000/mcp
            --transport http --protocol-era legacy --format json
          )

          "${inspector[@]}" --method tools/list \
            | jq -e --slurpfile config "$COMMANDHUB_CONFIG" \
                '(.result.tools | map(.name) | sort) == ($config[0].tools | map(.name) | sort)'

          "${inspector[@]}" --method tools/call --tool-name git_version \
            | jq -e '.result.isError == false and
                      (.result.structuredContent.stdout | startswith("git version "))'

          exit_code=0
          "${inspector[@]}" --method tools/call --tool-name git_diff_view \
            --tool-arg view=--patch > "$output_dir/invalid.json" || exit_code=$?
          test "$exit_code" -eq 5
          jq -e '.result.isError == true and
                 .result.structuredContent.code == "invalid_parameters"' \
            "$output_dir/invalid.json"
